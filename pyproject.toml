[project]
name = "tfg2025"
version = "0.1.5"
description = "TFG 2025"
requires-python = ">=3.12, <=3.13"
authors = [{ name = "Sergio" }]
dependencies = [
    "flwr[simulation]",
    "pillow",
    "torch",
    "reportlab",
    "scikit-learn",
    "matplotlib"
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pypdf>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

